[project]
name = "natronmcp"
version = "0.1.0"
description = "MCP bridge connecting Natron compositor to Claude AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/natronmcp"]

[project.scripts]
natronmcp-bridge = "natron_mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
