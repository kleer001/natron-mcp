[project]
name = "natronmcp"
version = "0.1.0"
description = "MCP bridge connecting Natron compositor to Claude AI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/natronmcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
